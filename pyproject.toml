[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "dasleafer"
version = "1.0.0"
description = "DAS + LeaferJS HFVI factory tooling (CLI + templates)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "DAS Leafer Contributors" }
]
dependencies = [
  "PyYAML==6.0.3",
  "dasops==1.0.0"
]

[project.scripts]
dasleafer = "dasleafer.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dasleafer*"]
